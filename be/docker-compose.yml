services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nest_project_db
    ports:
      - '5433:5433'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: